name: Sync upstream and apply DIRECT rules

on:
  schedule:
    # 每天 3 次（UTC 03:23 / 11:23 / 19:23 = 北京时间 11:23 / 19:23 / 03:23）
    # GitHub 定时任务可能延迟或丢弃，多跑几次保证当天能同步；无新内容时不会产生提交
    - cron: '23 3,11,19 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write # 允许在同步后手动触发 format_and_test

concurrency:
  group: myclash-sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          # 上游修改 .github/workflows/ 时，GITHUB_TOKEN 无权推送；配置了 SYNC_PAT 就用它
          token: ${{ secrets.SYNC_PAT || github.token }}

      - name: Record starting commit
        run: echo "BEFORE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Merge upstream updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/AIsouler/MyClash.git
          git fetch upstream main
          # 同一处出现冲突时优先采用上游版本，随后重新添加个人规则
          git merge --no-edit -X theirs upstream/main

      - name: Apply custom DIRECT rules
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('Script/Script.js')
          content = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'(?ms)^[ \t]*const[ \t]+prefixRules[ \t]*=[ \t]*\[[ \t]*\r?\n(?P<body>.*?)^[ \t]*\];'
          )
          matches = list(pattern.finditer(content))
          if len(matches) != 1:
              raise SystemExit('prefixRules 结构已变化，自动修改中止，请人工检查上游脚本。')

          block = matches[0]
          existing = set(re.findall(r'''["']([^"'\r\n]+)["']''', block.group('body')))
          required = [
              'DOMAIN-SUFFIX,yuchsh.top,DIRECT',
              'DOMAIN,prts.maa.plus,DIRECT',
          ]
          missing = [rule for rule in required if rule not in existing]
          if missing:
              insert = ''.join(f"  '{rule}',\n" for rule in missing)
              start = block.start('body')
              content = content[:start] + insert + content[start:]
              path.write_text(content, encoding='utf-8')
          print('规则检查完成，新增：' + (', '.join(missing) if missing else '无（已存在）'))
          PY

      - name: Verify JavaScript syntax
        run: node --check Script/Script.js

      - name: Commit and push if changed
        shell: bash
        run: |
          set -euo pipefail
          git add Script/Script.js
          if ! git diff --cached --quiet; then
            git commit -m 'chore: apply personal DIRECT rules'
          fi
          git push origin HEAD:main

      # GITHUB_TOKEN 推送不会触发 push 事件的工作流，这里用 workflow_dispatch 显式触发
      - name: Trigger format_and_test
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$BEFORE_SHA" ]; then
            gh workflow run format_and_test.yaml --ref main
          else
            echo '没有新提交，跳过 format_and_test'
          fi
