name: Sync upstream and apply DIRECT rules

on:
  schedule:
    # 每天 3 次（UTC 03:23 / 11:23 / 19:23 = 北京时间 11:23 / 19:23 / 03:23）
    # GitHub 定时任务可能延迟或丢弃，多跑几次保证当天能同步；无新内容时不会产生提交
    - cron: '23 3,11,19 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write # 允许在同步后手动触发 format_and_test

concurrency:
  group: myclash-sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          # 上游修改 .github/workflows/ 时，GITHUB_TOKEN 无权推送；配置了 SYNC_PAT 就用它
          token: ${{ secrets.SYNC_PAT || github.token }}

      - name: Record starting commit
        run: echo "BEFORE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Merge upstream updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/AIsouler/MyClash.git
          git fetch upstream main
          # 同一处出现冲突时优先采用上游版本，随后重新添加个人规则
          git merge --no-edit -X theirs upstream/main

      - name: Apply custom DIRECT rules to all JS/YAML files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          required = (
              'DOMAIN-SUFFIX,yuchsh.top,DIRECT',
              'DOMAIN,prts.maa.plus,DIRECT',
          )
          roots = (Path('Script'), Path('Config'))
          suffixes = {'.js', '.yaml', '.yml'}
          files = sorted(
              path
              for root in roots
              for path in root.rglob('*')
              if path.is_file() and path.suffix.lower() in suffixes
          )
          if not files:
              raise SystemExit('Script/ 和 Config/ 中没有找到 JS/YAML 文件')

          js_pattern = re.compile(
              r'(?ms)^[ \t]*const[ \t]+prefixRules[ \t]*=[ \t]*\[[ \t]*\r?\n(?P<body>.*?)^[ \t]*\];'
          )
          yaml_pattern = re.compile(r'(?m)^rules:[ \t]*(?:#.*)?(?:\r?\n|$)')

          for path in files:
              with path.open('r', encoding='utf-8', newline='') as file:
                  content = file.read()
              newline = '\r\n' if '\r\n' in content else '\n'

              if path.suffix.lower() == '.js':
                  matches = list(js_pattern.finditer(content))
                  if len(matches) != 1:
                      raise SystemExit(f'{path}: 无法唯一定位 prefixRules，请人工检查')
                  match = matches[0]
                  existing = set(re.findall(r'''["']([^"'\r\n]+)["']''', match.group('body')))
                  missing = [rule for rule in required if rule not in existing]
                  position = match.start('body')
                  insert = ''.join(f"  '{rule}',{newline}" for rule in missing)
              else:
                  matches = list(yaml_pattern.finditer(content))
                  if len(matches) != 1:
                      raise SystemExit(f'{path}: 无法唯一定位顶层 rules:，请人工检查')
                  match = matches[0]
                  # 只检查 rules: 对应的列表，不误判文件其他区域的规则。
                  rest = content[match.end():]
                  next_key = re.search(r'(?m)^[A-Za-z_][A-Za-z0-9_.-]*:[ \t]*', rest)
                  section = rest[:next_key.start()] if next_key else rest
                  existing = {
                      item.group('value').strip().strip('"\'')
                      for item in re.finditer(r'(?m)^[ \t]+-[ \t]+(?P<value>[^#\r\n]+)', section)
                  }
                  missing = [rule for rule in required if rule not in existing]
                  position = match.end()
                  insert = ''.join(f'  - {rule}{newline}' for rule in missing)

              if missing:
                  updated = content[:position] + insert + content[position:]
                  with path.open('w', encoding='utf-8', newline='') as file:
                      file.write(updated)
              print(f'{path}: ' + ('新增 ' + ', '.join(missing) if missing else '已存在，无需修改'))
          PY

      - name: Verify JavaScript syntax and whitespace
        shell: bash
        run: |
          set -euo pipefail
          find Script Config -type f -name '*.js' -print0 | xargs -0 -r -n 1 node --check
          git diff --check

      - name: Commit and push if changed
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- Script Config
          if ! git diff --cached --quiet; then
            git commit -m 'chore: apply personal DIRECT rules to JS and YAML'
          fi
          git push origin HEAD:main

      # GITHUB_TOKEN 推送不会触发 push 事件的工作流，这里用 workflow_dispatch 显式触发
      - name: Trigger format_and_test
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$BEFORE_SHA" ]; then
            gh workflow run format_and_test.yaml --ref main
          else
            echo '没有新提交，跳过 format_and_test'
          fi
