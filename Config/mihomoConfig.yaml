# --- 策略组 (Proxy Groups) ---

# 策略组通用配置
group_common_select:
  &group_common_select {
    type: select,
    timeout: 5000,
    max-failed-times: 3,
    empty-fallback: REJECT,
    url: 'https://www.apple.com/library/test/success.html',
  }

group_common_auto:
  &group_common_auto {
    type: url-test,
    interval: 600,
    timeout: 5000,
    max-failed-times: 3,
    empty-fallback: REJECT,
    url: 'https://www.apple.com/library/test/success.html',
    lazy: true,
    tolerance: 50,
    include-all: true,
    exclude-type: 'DIRECT',
    icon: 'https://fastly.jsdelivr.net/gh/AIsouler/MyClash@main/Icons/svg/Auto.svg',
    hidden: true,
  }

group_common_load:
  &group_common_load {
    type: load-balance,
    interval: 600,
    timeout: 5000,
    max-failed-times: 3,
    empty-fallback: REJECT,
    url: 'https://www.apple.com/library/test/success.html',
    lazy: true,
    strategy: 'sticky-sessions',
    include-all: true,
    exclude-type: 'DIRECT',
    icon: 'https://fastly.jsdelivr.net/gh/AIsouler/MyClash@main/Icons/svg/RoundRobin.svg',
    hidden: true,
  }

