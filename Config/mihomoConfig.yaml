#  ---------说明---------
#  mihomo配置（全量版）
#  作者：AIsouler
#  原仓库：https://github.com/AIsouler/MyClash
#  配置链接：https://raw.githubusercontent.com/AIsouler/MyClash/main/Config/mihomoConfig.yaml
#  友情推荐，非常好用、省电且内存占用低的代理软件：https://github.com/appshubcc/Bettbox
#  ---------------------

# --- 锚点定义 (通用属性) ---
proxy_providers_common:
  &proxy_providers_common {
    type: http,
    interval: 86400,
    proxy: DIRECT,
    exclude-type: 'DIRECT|REJECT|REMATCH',
    health-check: { enable: true, url: https://www.apple.com/library/test/success.html, interval: 600, lazy: true },
  }

# 全局过滤节点
global_exclude_filter:
  &global_exclude_filter {
    exclude-filter: '(?i)(群|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|电报|频道|无法|说明|提示|访问|支持|教程|关注|更新|作者|加入|超时|收藏|优惠|福利|邀请|好友|失联|选择|剩余|公益|发布|DIZTNA|通路|登录|定时|渠道|牢记|永久|余额|阁下|本站|刷新|导航|建议|重置|以下|过滤|⚠️|@|t\.me\/\+|\bexpire\b|\bhttps?:\/\/|\.com|\btraffic\b)',
  }

# 订阅提供者，如果你想要添加多个订阅提供者，可以复制 provider1 的配置块，并修改 url 、 path 和 additional-prefix 字段。
proxy-providers:
  provider1:
    <<: [*proxy_providers_common, *global_exclude_filter]
    url: '' # 此处单引号中间填入机场订阅链接
    age-secret-key: '' # 此处填入机场订阅链接解密私钥，如果机场订阅链接需要解密才能使用，请将解密私钥填入单引号中间，否则不要改动此项
    path: ./proxy_provider/provider1.yaml
    override:
      additional-prefix: 'p1 | ' # 给节点名称添加前缀，防止不同订阅的节点重名导致出现问题

# 以下是一个示例，各行缩进必须严格对齐provider1
# provider2:
#   <<: [*proxy_providers_common, *global_exclude_filter]
#   url: ''
#   age-secret-key: ''
#   path: ./proxy_provider/provider2.yaml
#   override:
#     additional-prefix: 'p2 | '

# 节点配置，可添加自定义节点
proxies:
  - { name: '🇨🇳 直连 | 双栈', type: direct }
  - { name: '🇨🇳 直连 | IPv4优先', type: direct, ip-version: ipv4-prefer }
  - { name: '🇨🇳 直连 | IPv6优先', type: direct, ip-version: ipv6-prefer }
  - { name: '🇨🇳 直连 | 仅IPv4', type: direct, ip-version: ipv4 }
  - { name: '🇨🇳 直连 | 仅IPv6', type: direct, ip-version: ipv6 }

# --- 基础全局配置 ---

mixed-port: 7890
allow-lan: true
ipv6: true
mode: rule
log-level: info
bind-address: '*'
unified-delay: true
tcp-concurrent: true
keep-alive-interval: 60
find-process-mode: strict
external-controller: '127.0.0.1:9090'
external-ui: ui
external-ui-url: 'https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip'

profile:
  store-selected: true
  store-fake-ip: true

# 国内外 DNS 定义
chinaDNS: &chinaDNS ['223.5.5.5#DIRECT', '119.29.29.29#DIRECT']
foreignDNS: &foreignDNS ['https://cloudflare-dns.com/dns-query#默认代理', 'https://dns.google/dns-query#默认代理']
defaultDNS: &defaultDNS ['114.114.114.114#DIRECT', 'tls://223.5.5.5#DIRECT', 'https://1.12.12.12/dns-query#DIRECT']
proxyServerDNS: &proxyServerDNS ['114.114.114.114#DIRECT', 'tls://223.5.5.5#DIRECT', 'https://doh.pub/dns-query#DIRECT']

dns:
  enable: true
  ipv6: true
  use-hosts: true
  cache-algorithm: arc
  use-system-hosts: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/15
  fake-ip-range6: 2001:2::1/48
  fake-ip-filter: ['rule-set:private', 'rule-set:fakeip_filter', 'rule-set:cn', 'rule-set:googlefcm']
  default-nameserver: *defaultDNS
  proxy-server-nameserver: *proxyServerDNS
  nameserver: *foreignDNS
  nameserver-policy:
    'rule-set:private': 'system'
    'rule-set:douyin': ['180.184.1.1#DIRECT', '180.184.2.2#DIRECT']
    'rule-set:cn': *chinaDNS
  direct-nameserver: *chinaDNS
  direct-nameserver-follow-policy: true

hosts:
  'doh.pub': ['1.12.12.12', '120.53.53.53']
  'cloudflare-dns.com': ['1.1.1.1', '1.0.0.1']
  'dns.google': ['8.8.8.8', '8.8.4.4']

  # 解决谷歌商店无法下载的问题
  'services.googleapis.cn': 'services.googleapis.com'

  # 屏蔽哔哩哔哩PCDN，解决访问视频卡顿/直播问题
  '+.mcdn.bilivideo.com': ['0.0.0.0']
  '+.mcdn.bilivideo.cn': ['0.0.0.0']
  '+.edge.mountaintoys.cn': ['0.0.0.0']
  '+.h2.smtcdns.net': ['0.0.0.0']

ntp:
  enable: true
  write-to-system: false
  server: 'ntp.aliyun.com'
  port: 123
  interval: 60

tun:
  enable: true
  stack: mips
  auto-route: true
  strict-route: true
  auto-redirect: true
  auto-detect-interface: true
  dns-hijack: ['any:53', 'tcp://any:53']

